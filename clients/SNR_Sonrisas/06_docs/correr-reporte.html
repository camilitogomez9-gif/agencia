<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Facturación — Sonrisas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    button {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: #6d28d9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      font-size: 14px;
      min-height: 22px;
      font-weight: 500;
    }

    .status.loading { color: #7c3aed; }
    .status.success { color: #16a34a; }
    .status.error   { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🦷</div>
    <h1>Reporte de Facturación</h1>
    <p class="subtitle">Presioná el botón para generar y enviar el reporte de hoy por correo.</p>

    <button id="btn" onclick="correrReporte()">Correr reporte</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const WEBHOOK = "https://[TU-INSTANCIA-N8N]/webhook/reporte_facturacion";

    async function correrReporte() {
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "Enviando...";
      status.className = "status loading";
      status.textContent = "Iniciando reporte...";

      try {
        const res = await fetch(WEBHOOK, { method: "POST" });
        if (res.ok) {
          btn.textContent = "Correr reporte";
          status.className = "status success";
          status.textContent = "✓ Reporte iniciado. Revisá tu correo en unos minutos.";
        } else {
          throw new Error("HTTP " + res.status);
        }
      } catch (e) {
        btn.textContent = "Correr reporte";
        status.className = "status error";
        status.textContent = "Error al conectar con el servidor. Intentá de nuevo.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
